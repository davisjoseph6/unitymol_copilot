# UnityMol Copilot Configuration

default_model: generic.qwen2.5-coder:14b
#default_model: generic.llama3.2:latest
#default_model: generic.mistral:7b
#default_model: generic.deepseek-coder-v2:16b
#  model: deepseek-coder-v2:16b

# LLM configuration
llm:
  provider: ollama
  model: generic.qwen2.5-coder:14b
  parameters:
    temperature: 0.7
    top_p: 0.9
    max_tokens: 2048

# Logging configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
